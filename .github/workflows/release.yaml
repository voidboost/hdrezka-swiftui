name: Release

on:
  push:
    branches:
      - main
    paths:
      - 'HDrezka.xcodeproj/project.pbxproj'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'bump'

    runs-on: macos-26

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      sha256: ${{ steps.sha256.outputs.sha256 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Inject Firebase config
        run: |
          echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 --decode > HDrezka/Resources/GoogleService-Info.plist
          plutil -lint HDrezka/Resources/GoogleService-Info.plist

      - name: Build app
        run: |
          xcodebuild archive \
            -scheme HDrezka \
            -project HDrezka.xcodeproj \
            -archivePath build/HDrezka.xcarchive \
            SKIP_INSTALL=NO \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Prepare app
        run: |
          mkdir -p release
          cp -R build/HDrezka.xcarchive/Products/Applications/HDrezka.app release/

      - name: Sign app
        run: codesign --force --deep --sign - release/HDrezka.app

      - name: Read version
        id: version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" \
            "release/HDrezka.app/Contents/Info.plist")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create DMG
        run: |
          npx create-dmg \
            release/HDrezka.app \
            release/ \
            --no-code-sign \
            --no-version-in-filename \
            --overwrite

      - name: Calculate SHA256
        id: sha256
        run: |
          echo "sha256=$(shasum -a 256 release/HDrezka.dmg | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: HDrezka-dmg
          path: release/HDrezka.dmg
          retention-days: 1

  publish:
    needs: build
    runs-on: macos-26

    permissions:
      contents: read

    env:
      VERSION: ${{ needs.build.outputs.version }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      - name: Download DMG
        uses: actions/download-artifact@v8
        with:
          name: HDrezka-dmg
          path: release/

      - name: Clone releases repository
        env:
          TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/hdrezka-releases.git

      - name: Copy DMG
        run: cp release/HDrezka.dmg hdrezka-releases/

      - name: Download Sparkle
        uses: robinraju/release-downloader@v1
        with:
          repository: "sparkle-project/Sparkle"
          latest: true
          fileName: "Sparkle*.tar.xz"

      - name: Extract Sparkle
        run: |
          mkdir -p Sparkle
          tar -xf Sparkle*.tar.xz -C Sparkle --strip-components=1

      - name: Generate Sparkle appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          KEY_FILE=$(mktemp)
          trap 'rm -f "$KEY_FILE"' EXIT
          echo "$SPARKLE_PRIVATE_KEY" > "$KEY_FILE"

          rm -f hdrezka-releases/appcast.xml
          ./Sparkle/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            hdrezka-releases/

      - name: Push releases
        working-directory: hdrezka-releases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "${VERSION}"
            git push
          else
            echo "No changes detected. Skipping deployment."
          fi

      - name: Clone homebrew repository
        env:
          TOKEN: ${{ secrets.HOMEBREW_TOKEN }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${TOKEN}@github.com/${{ github.repository_owner }}/homebrew-hdrezka.git

      - name: Generate Homebrew Cask
        run: |
          mkdir -p homebrew-hdrezka/Casks

          cat > homebrew-hdrezka/Casks/hdrezka.rb <<EOF
          cask "hdrezka" do
            version "${VERSION}"
            sha256 "${SHA256}"

            url "https://${{ github.repository_owner }}.github.io/hdrezka-releases/HDrezka.dmg"
            name "HDrezka"
            desc "Unofficial macOS client for HDrezka"
            homepage "https://github.com/${{ github.repository }}"

            livecheck do
              url "https://${{ github.repository_owner }}.github.io/hdrezka-releases/appcast.xml"
              strategy :sparkle do |items|
                items.map(&:short_version)
              end
            end

            auto_updates true
            depends_on macos: :sequoia

            app "HDrezka.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-dr", "com.apple.quarantine", "#{appdir}/HDrezka.app"],
                             sudo: false
            end

            zap trash: [
              "~/Library/Application Support/HDrezka",
              "~/Library/Caches/io.silentsea.hdrezka",
              "~/Library/Preferences/io.silentsea.hdrezka.plist",
              "~/Library/Saved Application State/io.silentsea.hdrezka.savedState",
            ]

            caveats <<~EOS
              Unofficial macOS client for HDrezka.

              This cask automatically removes the quarantine flag during install.

              If Gatekeeper blocks launch, run:

                xattr -dr com.apple.quarantine "/Applications/HDrezka.app"
            EOS
          end
          EOF

      - name: Push homebrew
        working-directory: homebrew-hdrezka
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if ! git diff --cached --quiet; then
            git commit -m "${VERSION}"
            git push
          else
            echo "No changes detected. Skipping deployment."
          fi

      - name: Send Telegram Message
        uses: cbrgm/telegram-github-action@v1
        with:
          token: ${{ secrets.TELEGRAM_TOKEN }}
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          parse-mode: "html"
          disable-web-page-preview: "true"
          message: |
            <b>HDrezka v${VERSION}</b>

            <b>🇷🇺 Русский</b>

            <b>Установка через <a href="https://brew.sh/ru/">Homebrew 📦</a></b>

            <b>Homebrew 5.x и более ранние версии</b>
            <pre><code>brew tap voidboost/hdrezka && brew install --cask hdrezka</code></pre>

            <b>Homebrew 6.x и более новые версии</b>
            <pre><code>brew tap voidboost/hdrezka && brew trust voidboost/hdrezka && brew install --cask hdrezka</code></pre>

            <i>В Homebrew 6.x необходимо явно доверять сторонним tap-репозиторям перед установкой пакетов из них.</i>

            <b>Или скачайте <a href="https://voidboost.github.io/hdrezka-releases/HDrezka.dmg">последний релиз 🚀</a></b>

            <a href="https://github.com/voidboost/hdrezka-swiftui#installation-troubleshooting">Проблемы с установкой?</a>


            <b>🇺🇸 English</b>

            <b>Install with <a href="https://brew.sh/">Homebrew 📦</a></b>

            <b>Homebrew 5.x and earlier</b>
            <pre><code>brew tap voidboost/hdrezka && brew install --cask hdrezka</code></pre>

            <b>Homebrew 6.x and later</b>
            <pre><code>brew tap voidboost/hdrezka && brew trust voidboost/hdrezka && brew install --cask hdrezka</code></pre>

            <i>Homebrew 6.x requires explicitly trusting third-party taps before installing packages from them.</i>

            <b>Or download <a href="https://voidboost.github.io/hdrezka-releases/HDrezka.dmg">latest release 🚀</a></b>

            <a href="https://github.com/voidboost/hdrezka-swiftui/blob/main/README_EN.md#installation-troubleshooting">Problems with installation?</a>